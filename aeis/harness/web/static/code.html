<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵枢 · 编码面板</title>
<link rel="stylesheet" href="/style.css">
<style>
  .code-layout { flex: 1; display: flex; min-height: 0; }
  .code-main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto; }
  .code-side { width: 320px; overflow-y: auto; padding: 14px; background: var(--panel);
               border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  textarea { width: 100%; min-height: 70px; border-radius: 8px; border: 1px solid var(--border);
             background: var(--bg); color: var(--text); padding: 10px; font-size: 14px; resize: vertical; }
  .step { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .step .tool { font-weight: 600; color: var(--accent); }
  .step .res { margin-top: 4px; font-size: 12px; color: var(--dim);
               white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; }
  .step.ok { border-left: 3px solid var(--accent); }
  .step.fail { border-left: 3px solid #f85149; }
  .btn { padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent);
         color: #0d1117; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.danger { background: #f85149; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">💻</span><h1>编码面板</h1>
    <a href="/" style="color: var(--dim); font-size: 12px;">← 返回对话</a></div>
  <div class="status-pill" id="ws-pill">工作区未设置</div>
</header>

<div class="code-layout">
  <div class="code-main">
    <div>
      <h3>📝 编码任务（能修改 / 能恢复 / 能验证 / 能记录）</h3>
      <textarea id="task-input" placeholder="例如：在 hello.py 中添加一个 add 函数并运行测试验证"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn" id="run-btn">提交任务</button>
        <input id="ws-input" placeholder="工作区路径（默认 AEIS 根）" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
      </div>
    </div>
    <div id="task-status" style="color: var(--dim); font-size: 13px;"></div>
    <div id="steps"></div>
    <div id="final" style="white-space: pre-wrap; border:1px solid var(--border); border-radius:8px; padding:10px; display:none;"></div>
  </div>

  <div class="code-side">
    <div class="card"><h3>📋 任务历史</h3><div id="task-list">加载中…</div></div>
    <div class="card"><h3>💾 快照（回滚点）</h3><div id="snap-list">无</div></div>
    <div class="card"><h3>🛡 操作说明</h3>
      <div style="font-size:12px; color:var(--dim); line-height:1.7;">
        · 每次写入前自动快照（可回滚）<br>
        · 修改后灵枢会运行验证命令<br>
        · 全部步骤留痕可审计<br>
        · 违反宪章的动作会被拦截
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let currentTask = null;
let pollTimer = null;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderSteps(result){
  const box = $("steps");
  box.innerHTML = "";
  const steps = (result && result.steps) || [];
  if (!steps.length) { box.innerHTML = '<div style="color:var(--dim)">（执行中…）</div>'; return; }
  for (const s of steps) {
    const div = document.createElement("div");
    div.className = "step " + (s.ok ? "ok" : "fail");
    div.innerHTML = `<div><span class="tool">${esc(s.tool)}</span> <span style="color:var(--dim)">#${s.step}</span></div>
      <div style="font-size:12px; color:var(--dim);">${esc(s.args)}</div>
      <div class="res">${esc(s.result)}</div>`;
    box.appendChild(div);
  }
}

async function pollTask(){
  if (!currentTask) return;
  const r = await fetch(`/api/code/${currentTask}`);
  const d = await r.json();
  $("task-status").textContent = `状态: ${d.status}`;
  if (d.result) {
    renderSteps(d.result);
    if (d.result.final) {
      const f = $("final");
      f.style.display = "block";
      f.textContent = "💬 " + d.result.final;
    }
  }
  const snaps = d.snapshots || [];
  $("snap-list").innerHTML = snaps.length
    ? snaps.map(s => `<div style="font-size:12px; padding:3px 0;">
        ${esc(s.id)} · ${esc(s.note || "")}
        <button class="btn ghost" onclick="doRevert('${s.id}')" style="font-size:11px; padding:2px 8px;">回滚</button></div>`).join("")
    : "无";
  if (d.status === "running") { clearTimeout(pollTimer); pollTimer = setTimeout(pollTask, 2000); }
  else { clearTimeout(pollTimer); loadTasks(); }
}

async function doRevert(snapId){
  if (!currentTask) return;
  const r = await fetch(`/api/code/${currentTask}/revert`, {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({snapshot: snapId})});
  const d = await r.json();
  alert(d.ok ? `已回滚（恢复 ${d.restored} 文件）` : "回滚失败: " + (d.error || ""));
}

async function submitTask(){
  const task = $("task-input").value.trim();
  if (!task) { alert("请输入任务"); return; }
  const ws = $("ws-input").value.trim();
  const r = await fetch("/api/code", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({task, workspace: ws || undefined})});
  const d = await r.json();
  if (!d.ok) { alert("提交失败: " + d.error); return; }
  currentTask = d.task_id;
  $("steps").innerHTML = "";
  $("final").style.display = "none";
  $("ws-pill").textContent = "工作区: " + (ws || "默认");
  $("task-status").textContent = "状态: running";
  pollTask();
}

async function loadTasks(){
  const r = await fetch("/api/code");
  const d = await r.json();
  const list = (d.tasks || []).map(t =>
    `<div style="font-size:12px; padding:4px 0; cursor:pointer;" onclick="openTask('${t.task_id}')">
      ${esc(t.task)} <span style="color:${t.status==='running'?'var(--accent)':'var(--dim)'}">[${t.status}]</span></div>`).join("");
  $("task-list").innerHTML = list || "无任务";
}

async function openTask(id){
  currentTask = id;
  $("task-status").textContent = "状态: 加载中";
  pollTask();
}

$("run-btn").addEventListener("click", submitTask);
$("task-input").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) submitTask(); });
loadTasks();
</script>
</body>
</html>
